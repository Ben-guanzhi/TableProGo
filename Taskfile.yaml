version: '3'

vars:
  APP_NAME: "TableProGo"
  BUILD_DIR: "build"
  FRONTEND_DIR: "frontend"

tasks:
  default:
    desc: Build the application
    cmds:
      - task: build

  build:
    desc: Build the application
    cmds:
      - go build -o {{.BUILD_DIR}}/{{.APP_NAME}}.exe

  dev:
    desc: Run in development mode
    cmds:
      - go run .

  test:
    desc: Run all tests (add -race to catch data races)
    cmds:
      - go test ./...

  vet:
    desc: Run go vet on all packages
    cmds:
      - go vet ./...

  check:
    desc: Format check, vet, and test all packages
    cmds:
      - task: vet
      - task: test

  clean:
    desc: Clean build artifacts
    cmds:
      - cmd: rm -rf {{.BUILD_DIR}}
        platforms: [linux, darwin]
      - cmd: Remove-Item -Recurse -Force {{.BUILD_DIR}} -ErrorAction SilentlyContinue
        platforms: [windows]

  frontend:build:
    desc: Build frontend
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm run build

  frontend:install:
    desc: Install frontend dependencies
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - npm install
