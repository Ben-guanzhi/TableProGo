name: ci

on:
  push:
  pull_request:

jobs:
  go:
    name: go ${{ matrix.dir }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The root module is checked by the `app` job instead: main.go has
        # //go:embed all:frontend/dist, so it cannot even compile `go vet` on a
        # runner that has not built the frontend yet, and that happens on this
        # job's separate runners.
        dir: [tableprosql, tableproxlsx]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            tableprosql/go.sum
            tableproxlsx/go.sum
            go.sum

      # Scoped to this module's own packages: ./... skips tableprosql/,
      # tableproxlsx/ and fynequery/, which are separate modules with their own
      # checks. gofmt is given file globs rather than directories, because a
      # directory argument makes it recurse into those other modules too.
      - name: gofmt
        working-directory: ${{ matrix.dir }}
        run: sh "$GITHUB_WORKSPACE/.github/scripts/gate.sh" sh -c 'for d in $(go list -f "{{.Dir}}" ./...); do test -z "$(gofmt -l "$d"/*.go)"; done'

      - name: go vet
        working-directory: ${{ matrix.dir }}
        run: sh "$GITHUB_WORKSPACE/.github/scripts/gate.sh" go vet ./...

      - name: go test -race
        working-directory: ${{ matrix.dir }}
        run: sh "$GITHUB_WORKSPACE/.github/scripts/gate.sh" go test -race -count=1 ./...

  app:
    name: frontend + wails app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Wails v3 links the system WebKitGTK through cgo on Linux
      # (`#cgo linux pkg-config: gtk4 webkitgtk-6.0 libsoup-3.0 gio-unix-2.0
      # gobject-2.0 glib-2.0`, plus `x11` for global shortcuts), so `go build`
      # fails on a bare runner. No build tag is set, so this is the gtk4 path
      # rather than gtk+-3.0 / webkit2gtk-4.1.
      - name: Install WebKitGTK build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev \
            libglib2.0-dev libx11-dev

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: npm test
        working-directory: frontend
        run: sh "$GITHUB_WORKSPACE/.github/scripts/gate.sh" npm test

      # main.go has //go:embed all:frontend/dist, so the app cannot build until
      # this step has produced frontend/dist. This order is not optional.
      - name: npm run build
        working-directory: frontend
        run: sh "$GITHUB_WORKSPACE/.github/scripts/gate.sh" npm run build

      # main.go has //go:embed all:frontend/dist, so the root module cannot even
      # be typechecked until the build above has produced frontend/dist. That is
      # why the root is gated here and not in the parallel `go` matrix.
      - name: gofmt (root)
        run: sh "$GITHUB_WORKSPACE/.github/scripts/gate.sh" sh -c 'for d in $(go list -f "{{.Dir}}" ./...); do test -z "$(gofmt -l "$d"/*.go)"; done'

      - name: go vet (root)
        run: sh "$GITHUB_WORKSPACE/.github/scripts/gate.sh" go vet ./...

      - name: go test -race
        run: sh "$GITHUB_WORKSPACE/.github/scripts/gate.sh" go test -race -count=1 ./...

      - name: go build
        run: sh "$GITHUB_WORKSPACE/.github/scripts/gate.sh" go build -o build/TableProGo.exe .
