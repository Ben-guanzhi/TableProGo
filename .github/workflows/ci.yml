name: ci

on:
  push:
  pull_request:

jobs:
  go:
    name: go ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [tableprosql, tableproxlsx, .]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            tableprosql/go.sum
            tableproxlsx/go.sum
            go.sum

      # Scoped to this module's own packages: ./... skips tableprosql/,
      # tableproxlsx/ and fynequery/, which are separate modules with their own
      # checks. gofmt is given file globs rather than directories, because a
      # directory argument makes it recurse into those other modules too.
      - name: gofmt
        working-directory: ${{ matrix.dir }}
        run: |
          for d in $(go list -f '{{.Dir}}' ./...); do
            test -z "$(gofmt -l "$d"/*.go)"
          done

      - name: go vet
        working-directory: ${{ matrix.dir }}
        run: go vet ./...

      - name: go test
        working-directory: ${{ matrix.dir }}
        run: go test -count=1 ./...

  app:
    name: frontend + wails app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: npm test
        working-directory: frontend
        run: npm test

      # main.go has //go:embed all:frontend/dist, so the app cannot build until
      # this step has produced frontend/dist. This order is not optional.
      - name: npm run build
        working-directory: frontend
        run: npm run build

      - name: go build
        run: go build -o build/TableProGo.exe .
