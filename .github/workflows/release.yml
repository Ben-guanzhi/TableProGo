name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            os: ubuntu-24.04
            ext: ""
          - goos: linux
            goarch: arm64
            os: ubuntu-24.04
            ext: ""
          - goos: darwin
            goarch: amd64
            os: macos-14
            ext: ""
          - goos: darwin
            goarch: arm64
            os: macos-14
            ext: ""
          - goos: windows
            goarch: amd64
            os: windows-latest
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      # Same sibling replaces as CI (see the `go` job in ci.yml): both the root
      # module's ../dbcore and the nested modules' ../../dbcore resolve to a
      # sibling of this checkout, and nothing else provides it, so a tag-triggered
      # release fails at the first go build without this step. See
      # PUBLISH-BLOCKER-dbcore-module-path-2026-10-26.md at the workspace root.
      - name: check out dbcore (sibling, for the local replace)
        env:
          DBCORE_TOKEN: ${{ secrets.DBCORE_CHECKOUT_TOKEN }}
        run: |
          set -eu
          dest="$(dirname "$GITHUB_WORKSPACE")/dbcore"
          if [ -n "${DBCORE_TOKEN:-}" ]; then
            hdr="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$DBCORE_TOKEN" | base64 -w0)"
            git -c "http.extraheader=$hdr" clone --depth 1 https://github.com/Ben-guanzhi/dbcore.git "$dest"
          else
            git clone --depth 1 https://github.com/Ben-guanzhi/dbcore.git "$dest"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: npm run build
        working-directory: frontend
        run: npm run build

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          mkdir -p dist
          go build -trimpath \
            -ldflags "-s -w" \
            -o "dist/TableProGo-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}" \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tableprogo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  sign-and-release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten artifacts
        run: |
          find dist -type f -exec mv {} dist/ \;
          rmdir dist/*/ 2>/dev/null || true

      - name: Create checksums
        run: sha256sum dist/* > dist/checksums.txt

      - name: Sign checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "$GPG_PASSPHRASE" | gpg --batch --pinentry-mode loopback --detach-sign --armor --output dist/checksums.txt.asc dist/checksums.txt

      - name: Generate SBOM
        uses: anchore/sbom-action@v3
        with:
          output: dist/sbom.spdx.json
          format: spdx-json
          artifact-type: project

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TableProGo ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
